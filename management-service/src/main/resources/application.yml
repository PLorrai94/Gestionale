server:
  port: 8082 # Porta specifica per il Management Service

spring:
  application:
    name: management-service
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1 # Assicurati che corrisponda al tuo DB Docker
    username: SYSTEM
    password: yourStrongPassword! # Usa la tua password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update # Solo per sviluppo! In produzione usare 'none' e Flyway/Liquibase.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/ # Indirizzo dell'Eureka Server