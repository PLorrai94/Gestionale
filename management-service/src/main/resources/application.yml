server:
  port: 8082

spring:
  application:
    name: management-service

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: MANAGEMENT_USER                    # Utente con accesso in sola lettura/scrittura
    password: MANAGEMENTPASS
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      schema: GESTIONALE_OWNER                   # Schema logico del pool

  jpa:
    hibernate:
      ddl-auto: validate                         # Flyway gestisce le migrazioni
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true
        default_schema: GESTIONALE_OWNER         # Schema effettivo delle entità

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

logging:
  level:
    root: INFO
    org.springframework.jdbc: DEBUG
    org.flywaydb: DEBUG
    com.zaxxer.hikari: DEBUG
    org.hibernate.orm.jdbc.connections.internal: DEBUG
    com.PierLorrai.Gestionale: DEBUG

management:
  metrics:
    enable:
      system:
        cpu: false
      process:
        cpu: false
        files: false
        memory: false
        uptime: false
  defaults:
    enabled: false