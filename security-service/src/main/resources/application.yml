spring:
    application:
        name: security-service
    datasource:
        url: jdbc:oracle:thin:@localhost:1521/XEPDB1
        username: SYSTEM
        password: yourStrongPassword!
        driver-class-name: oracle.jdbc.OracleDriver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    security:
        jwt:
            secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # ES.: una stringa base64 encoding di 256-bit (32 bytes) o più. GENERARE UNA NUOVA CHIAVE!
            expiration: 86400000 # 24 ore in millisecondi (24 * 60 * 60 * 1000)

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
