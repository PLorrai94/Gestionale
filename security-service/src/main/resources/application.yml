spring:
    application:
        name: security-service
    datasource:
        url: jdbc:oracle:thin:@localhost:1521/XEPDB1
        username: SYSTEM
        password: yourStrongPassword!
        driver-class-name: oracle.jdbc.OracleDriver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
