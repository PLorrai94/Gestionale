<div class="container">
  <h2>Products</h2>

  <p *ngIf="errorMessage">{{ errorMessage }}</p>

  <table *ngIf="products.length">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Price</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of products">
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
      </tr>
    </tbody>
  </table>

  <a routerLink="/">← Back to Dashboard</a>
</div>
