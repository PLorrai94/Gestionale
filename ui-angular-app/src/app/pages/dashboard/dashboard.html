<div class="dashboard">
  <h2>Dashboard</h2>
  
  <div class="welcome-message">
    <p>Welcome to the Gestionale dashboard!</p>
    <p>This is a placeholder dashboard. Authentication is working correctly.</p>
    <p>You can navigate to other sections using the sidebar or menu.</p>
  </div>

  <div class="quick-actions">
    <h3>Quick Actions</h3>
    <div class="actions-grid">
      <a routerLink="/products" class="action-card">
        <span class="action-icon">📦</span>
        <span>Products</span>
      </a>
      <a routerLink="/customers" class="action-card">
        <span class="action-icon">👥</span>
        <span>Customers</span>
      </a>
      <a routerLink="/orders" class="action-card">
        <span class="action-icon">📋</span>
        <span>Orders</span>
      </a>
      <button (click)="logout()" class="action-card logout-btn">
        <span class="action-icon">🚪</span>
        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
