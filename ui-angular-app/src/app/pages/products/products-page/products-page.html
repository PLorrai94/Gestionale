<div class="products-page">
  <div class="page-header">
    <h2>Prodotti</h2>
    <a routerLink="/products/new" class="btn btn-primary">Nuovo Prodotto</a>
  </div>

  <app-product-search-form (search)="onSearch($event)"></app-product-search-form>
  <app-product-table [products]="filteredProducts" (edit)="onEdit($event)" (delete)="onDelete($event)"></app-product-table>
</div>
