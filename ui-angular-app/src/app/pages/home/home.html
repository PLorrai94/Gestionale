<header class="hero" #heroSection>
  <div class="particles-container">
    <div
      *ngFor="let particle of particles; trackBy: trackByParticle"
      class="particle"
      [style.left.%]="particle.x"
      [style.top.%]="particle.y"
      [style.width.px]="particle.size"
      [style.height.px]="particle.size"
      [style.opacity]="particle.opacity">
    </div>
  </div>

  <div class="hero-gradient"></div>
  <div class="container">
    <div class="hero-content" @heroText>
      <h1>Manage Your Microservices with Ease</h1>
      <p class="subtitle">
        An intuitive dashboard to monitor and interact with your microservices architecture.
      </p>
      <div class="hero-buttons">
        <button class="btn btn-primary" (click)="scrollToFeatures()">Explore Services</button>
      </div>
    </div>
  </div>
</header>

<section class="features-section" #featuresSection @staggerCards>
  <div class="container">
    <h2>Your Services</h2>
    <p class="section-subtitle">Explore the microservices that make up your application.</p>

    <div class="features-grid">
      <div class="card" *ngFor="let feature of features; trackBy: trackByFeature">
        <div class="card-icon">
          <i class="lucide" [class]="'lucide-' + feature.icon"></i>
        </div>
        <div class="card-content">
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.description }}</p>
          <a *ngIf="feature.link" [routerLink]="feature.link" class="card-arrow">
            <i class="lucide lucide-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
