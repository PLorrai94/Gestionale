<div class="form-page">
  <h2>{{ isEditMode ? 'Modifica Cliente' : 'Nuovo Cliente' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="entity-form">
    <div class="form-group">
      <label for="firstName">Nome</label>
      <input id="firstName" formControlName="firstName" />
      <span class="error" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">Campo obbligatorio</span>
    </div>

    <div class="form-group">
      <label for="lastName">Cognome</label>
      <input id="lastName" formControlName="lastName" />
      <span class="error" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">Campo obbligatorio</span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Email non valida</span>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Telefono</label>
      <input id="phoneNumber" formControlName="phoneNumber" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Salva</button>
      <a routerLink="/customers" class="btn btn-secondary">Annulla</a>
    </div>
  </form>
</div>
