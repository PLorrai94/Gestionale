<div class="form-page">
  <h2>{{ isEditMode ? 'Edit Customer' : 'New Customer' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="entity-form">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input id="firstName" formControlName="firstName" />
      <span class="error" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">Required field</span>
    </div>

    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input id="lastName" formControlName="lastName" />
      <span class="error" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">Required field</span>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
      <span class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Invalid email</span>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Phone</label>
      <input id="phoneNumber" formControlName="phoneNumber" />
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save</button>
      <a routerLink="/customers" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
