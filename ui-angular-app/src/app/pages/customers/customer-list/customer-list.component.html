<div class="page">
  <div class="page-header">
    <h2>Customers</h2>
    <a routerLink="/customers/new" class="btn btn-primary">New Customer</a>
  </div>

  <table class="data-table" *ngIf="customers.length; else noData">
    <thead>
      <tr>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.firstName }}</td>
        <td>{{ c.lastName }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phoneNumber || '-' }}</td>
        <td class="actions">
          <button class="btn-icon" (click)="onEdit(c)" title="Edit">&#9998;</button>
          <button class="btn-icon btn-danger" (click)="onDelete(c)" title="Delete">&#10005;</button>
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #noData>
    <p class="no-data">No customers found.</p>
  </ng-template>
</div>
