<div class="page">
  <div class="page-header">
    <h2>User Management</h2>
    <a routerLink="/admin/users/new" class="btn btn-primary">New User</a>
  </div>

  <table class="data-table" *ngIf="users.length; else noData">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Roles</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span class="role-badge" *ngFor="let role of u.roles">{{ role }}</span>
        </td>
        <td>
          <span class="status-badge" [class.active]="u.enabled" [class.locked]="!u.accountNonLocked">
            {{ !u.accountNonLocked ? 'Locked' : (u.enabled ? 'Active' : 'Disabled') }}
          </span>
        </td>
        <td class="actions">
          <button class="btn-icon" (click)="onEdit(u)" title="Edit">&#9998;</button>
          <button class="btn-icon btn-danger" (click)="onDelete(u)" title="Delete">&#10005;</button>
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #noData>
    <p class="no-data">No users found.</p>
  </ng-template>
</div>
