<div class="login-container">
  <h2>Sign In</h2>
  
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    
    <div class="form-group">
      <label for="username">Username</label>
      <input 
        id="username" 
        type="text" 
        formControlName="username" 
        placeholder="Enter username"
        [class.invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
      <div class="error" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        <span *ngIf="loginForm.get('username')?.errors?.['required']">Username is required</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password" 
        placeholder="Enter password"
        [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
      </div>
    </div>

    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button 
      type="submit" 
      class="submit-btn" 
      [disabled]="loginForm.invalid || loading">
      {{ loading ? 'Signing In...' : 'Sign In' }}
    </button>

    <div class="register-link">
      Don't have an account? <a routerLink="/auth/register">Create Account</a>
    </div>
  </form>
</div>
