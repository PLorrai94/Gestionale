server:
  port: 8083 # Porta specifica per il Batch Service

spring:
  application:
    name: batch-service
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1 # Assicurati che corrisponda al tuo DB Docker
    username: SYSTEM
    password: yourStrongPassword! # Usa la tua password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update # ATTENZIONE: SOLO per sviluppo! In produzione: 'none' o 'validate'.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  batch:
    jdbc:
      initialize-schema: always # Spring Batch creerà le tabelle necessarie per il JobRepository al primo avvio
    job:
      enabled: false # Disabilita l'auto-esecuzione di tutti i job all'avvio, li lanceremo manualmente

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/ # Indirizzo dell'Eureka Server